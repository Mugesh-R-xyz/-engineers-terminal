<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#F7EED8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#003366" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)" rx="12"/>
  <rect width="798" height="448" x="1" y="1" fill="none" stroke="#D9C8A3" stroke-width="2" rx="12"/>

  <!-- Concept Disclaimer Banner -->
  <rect x="0" y="0" width="800" height="28" fill="#003366" rx="12 12 0 0"/>
  <text x="400" y="18" fill="#F5DEB3" font-family="'Manrope', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">
    CONCEPT VISUALIZATION — PROJECT IN DEVELOPMENT
  </text>

  <!-- Browser/App Header Bar -->
  <rect x="24" y="44" width="752" height="48" fill="#FFFFFF" stroke="#D9C8A3" stroke-width="1" rx="8" filter="url(#shadow)"/>
  
  <!-- Logo & Title -->
  <rect x="38" y="56" width="24" height="24" rx="6" fill="#A73E18"/>
  <path d="M46 62 L54 70 M54 62 L46 70" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="70" y="72" fill="#003366" font-family="'Manrope', system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="-0.2">
    Campus X Voice
  </text>
  <rect x="195" y="60" width="70" height="18" rx="4" fill="#FBEFD2" stroke="#D9C8A3"/>
  <text x="230" y="73" fill="#A73E18" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">
    SJCE HUB
  </text>

  <!-- Search / Input Simulation -->
  <rect x="280" y="54" width="280" height="28" rx="6" fill="#FFF9EA" stroke="#D9C8A3"/>
  <circle cx="295" cy="68" r="5" fill="none" stroke="#3F5D7D" stroke-width="1.5"/>
  <line x1="299" y1="72" x2="304" y2="77" stroke="#3F5D7D" stroke-width="1.5"/>
  <text x="312" y="72" fill="#3F5D7D" font-family="'Inter', system-ui, sans-serif" font-size="12">
    Search campus feedback or department...
  </text>

  <!-- User Profile Badge -->
  <rect x="630" y="54" width="134" height="28" rx="6" fill="#003366"/>
  <circle cx="645" cy="68" r="7" fill="#F5DEB3"/>
  <text x="659" y="72" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600">
    Google Auth (SJCE)
  </text>

  <!-- Main Body Grid: Left Navigation Sidebar -->
  <rect x="24" y="104" width="180" height="326" fill="#FFFFFF" stroke="#D9C8A3" stroke-width="1" rx="8" filter="url(#shadow)"/>
  
  <text x="40" y="132" fill="#3F5D7D" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">
    CATEGORIES
  </text>

  <!-- Nav Item: Active -->
  <rect x="34" y="144" width="160" height="32" rx="6" fill="#003366"/>
  <circle cx="48" cy="160" r="4" fill="#A73E18"/>
  <text x="60" y="165" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600">
    All Feedback (Live)
  </text>

  <!-- Nav Item 2 -->
  <rect x="34" y="184" width="160" height="32" rx="6" fill="transparent"/>
  <text x="60" y="205" fill="#353A3E" font-family="'Inter', system-ui, sans-serif" font-size="12">
    Lab &amp; Equipment
  </text>
  <rect x="165" y="193" width="20" height="15" rx="4" fill="#FBEFD2"/>
  <text x="175" y="204" fill="#A73E18" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">12</text>

  <!-- Nav Item 3 -->
  <rect x="34" y="224" width="160" height="32" rx="6" fill="transparent"/>
  <text x="60" y="245" fill="#353A3E" font-family="'Inter', system-ui, sans-serif" font-size="12">
    Academic Syllabus
  </text>
  <rect x="165" y="233" width="20" height="15" rx="4" fill="#FBEFD2"/>
  <text x="175" y="244" fill="#A73E18" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">8</text>

  <!-- Nav Item 4 -->
  <rect x="34" y="264" width="160" height="32" rx="6" fill="transparent"/>
  <text x="60" y="285" fill="#353A3E" font-family="'Inter', system-ui, sans-serif" font-size="12">
    Campus Wi-Fi
  </text>

  <!-- Nav Item 5 -->
  <rect x="34" y="304" width="160" height="32" rx="6" fill="transparent"/>
  <text x="60" y="325" fill="#353A3E" font-family="'Inter', system-ui, sans-serif" font-size="12">
    Hostel &amp; Canteen
  </text>

  <!-- Voice Input Quick Action Box in Sidebar -->
  <rect x="34" y="352" width="160" height="66" rx="6" fill="#FBEFD2" stroke="#D9C8A3"/>
  <text x="44" y="372" fill="#003366" font-family="'Manrope', system-ui, sans-serif" font-size="11" font-weight="700">
    Voice Feedback
  </text>
  <text x="44" y="388" fill="#353A3E" font-family="'Inter', system-ui, sans-serif" font-size="10">
    Record spoken input
  </text>
  <rect x="44" y="394" width="140" height="16" rx="4" fill="#A73E18"/>
  <text x="114" y="406" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
    &#x1F3A4; Record 30s Audio
  </text>

  <!-- Right Content Feed Area -->
  <rect x="216" y="104" width="560" height="50" rx="8" fill="#FFFFFF" stroke="#D9C8A3" filter="url(#shadow)"/>
  <text x="232" y="134" fill="#003366" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="800">
    Student Submissions Stream
  </text>
  <rect x="645" y="116" width="118" height="26" rx="6" fill="#A73E18"/>
  <text x="704" y="133" fill="#FFFFFF" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    + New Feedback
  </text>

  <!-- Feedback Card 1 -->
  <rect x="216" y="164" width="560" height="124" rx="8" fill="#FFFFFF" stroke="#D9C8A3" filter="url(#shadow)"/>
  
  <!-- Upvote Column -->
  <rect x="228" y="178" width="44" height="64" rx="6" fill="#FFF9EA" stroke="#D9C8A3"/>
  <polygon points="250,188 242,198 258,198" fill="#A73E18"/>
  <text x="250" y="214" fill="#003366" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">24</text>
  <text x="250" y="228" fill="#3F5D7D" font-family="'Inter', system-ui, sans-serif" font-size="8" text-anchor="middle">VOTES</text>

  <!-- Card 1 Info -->
  <rect x="284" y="178" width="76" height="18" rx="4" fill="#E8F4EC"/>
  <text x="322" y="191" fill="#1D6B45" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">
    UNDER REVIEW
  </text>
  <rect x="368" y="178" width="80" height="18" rx="4" fill="#FBEFD2"/>
  <text x="408" y="191" fill="#A73E18" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">
    ECE DEPT
  </text>

  <text x="284" y="218" fill="#003366" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="700">
    DSP Lab: DSO probes in Station 4 &amp; 7 require replacement before practicals
  </text>
  <text x="284" y="238" fill="#353A3E" font-family="'Inter', system-ui, sans-serif" font-size="12">
    Signal attenuation and loose BNC connectors are causing noisy FFT readings during lab tests.
  </text>
  <text x="284" y="268" fill="#3F5D7D" font-family="'Inter', system-ui, sans-serif" font-size="10.5">
    Submitted by 2nd-yr ECE student &middot; 3 comments &middot; Verified student profile
  </text>

  <!-- Feedback Card 2 -->
  <rect x="216" y="298" width="560" height="132" rx="8" fill="#FFFFFF" stroke="#D9C8A3" filter="url(#shadow)"/>
  
  <!-- Upvote Column -->
  <rect x="228" y="312" width="44" height="64" rx="6" fill="#FFF9EA" stroke="#D9C8A3"/>
  <polygon points="250,322 242,332 258,332" fill="#A73E18"/>
  <text x="250" y="348" fill="#003366" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">41</text>
  <text x="250" y="362" fill="#3F5D7D" font-family="'Inter', system-ui, sans-serif" font-size="8" text-anchor="middle">VOTES</text>

  <!-- Card 2 Info -->
  <rect x="284" y="312" width="82" height="18" rx="4" fill="#FDF3E7"/>
  <text x="325" y="325" fill="#A73E18" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">
    IN PROGRESS
  </text>
  <rect x="374" y="312" width="104" height="18" rx="4" fill="#FBEFD2"/>
  <text x="426" y="325" fill="#003366" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">
    INFRASTRUCTURE
  </text>

  <text x="284" y="352" fill="#003366" font-family="'Manrope', system-ui, sans-serif" font-size="14" font-weight="700">
    Central Library: Need dedicated power strip sockets in Quiet Reading Area
  </text>
  <text x="284" y="372" fill="#353A3E" font-family="'Inter', system-ui, sans-serif" font-size="12">
    Students working on laptops during extended project hours have only two working wall outlets.
  </text>
  <text x="284" y="402" fill="#3F5D7D" font-family="'Inter', system-ui, sans-serif" font-size="10.5">
    Submitted by SJCE student &middot; 7 comments &middot; Assigned to Facility Management
  </text>
</svg>
